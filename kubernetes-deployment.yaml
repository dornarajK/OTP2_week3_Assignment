apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temperature-converter-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature-converter
  template:
    metadata:
      labels:
        app: temperature-converter
    spec:
      containers:
        - name: temperature-converter
          image: dornarajk/temperature-converter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: novnc
              containerPort: 6080
          env:
            - name: APP_DB_URL
              value: jdbc:h2:/data/temperaturedb
          volumeMounts:
            - name: app-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: novnc
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: novnc
            initialDelaySeconds: 45
            periodSeconds: 20
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: temperature-converter-data
---
apiVersion: v1
kind: Service
metadata:
  name: temperature-converter
spec:
  type: NodePort
  selector:
    app: temperature-converter
  ports:
    - name: novnc
      port: 6080
      targetPort: novnc
      nodePort: 30080
